name: Train and publish own AI model

on:
  push:
    branches:
      - main
    paths:
      - "KiTrain/**"
      - "KiLernprojekt/**/*.cs"
      - ".github/workflows/ai-training.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout own project
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build model trainer
        run: dotnet build KiTrain/KiTrain.csproj

      - name: Restore previous model checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "No previous release found; starting the initial training."
          else
            gh release download "$tag" \
              --pattern eigene-gewichte.json \
              --dir KiLernprojekt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Train from project files
        run: dotnet run --project KiTrain/KiTrain.csproj --no-build

      - name: Create checksum and manifest
        shell: bash
        run: |
          cd KiLernprojekt
          sha=$(sha256sum eigene-gewichte.json | cut -d' ' -f1)
          tag="ai-model-${GITHUB_RUN_ID}"
          cat > manifest.json <<EOF
          {
            "version": "${GITHUB_RUN_ID}",
            "downloadUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/eigene-gewichte.json",
            "sha256": "$sha"
          }
          EOF

      - name: Publish model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="ai-model-${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if gh release create "$tag" \
              KiLernprojekt/eigene-gewichte.json \
              KiLernprojekt/manifest.json \
              --title "Own AI model ${GITHUB_RUN_ID}"; then
              exit 0
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" \
                KiLernprojekt/eigene-gewichte.json \
                KiLernprojekt/manifest.json \
                --clobber \
                --repo "$GITHUB_REPOSITORY"
              exit $?
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Release creation failed; retrying in $((attempt * 10)) seconds."
              sleep $((attempt * 10))
            fi
          done
          exit 1
